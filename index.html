<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
  </head>
  <body>
    <!-- Contenedor principal -->
    <div class="wrapper">
      <!-- Panel superior con estadísticas -->
      <div class="game-details">
        <div class="score">Puntaje: 0 / 50</div>
        <div class="biome-name">Pradera</div>
        <div class="high-score">Récord: 0</div>
      </div>

      <div class="objective">Cargando objetivo...</div>

      <!-- Tablero donde se muestran la serpiente y la comida -->
      <div class="game"></div>

      <!-- Pantalla de Fin del Juego / Victoria -->
      <div class="game-over hidden">
        <div class="game-over-content">
          <h1 id="game-over-title">Juego Terminado</h1>
          <div id="final-score"></div>
          <button onclick="location.reload()">Jugar otra vez</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
